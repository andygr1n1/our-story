version: '3.8'
networks:
    web_clients:
        external: true
services:
    kzen:
        container_name: ourstory-container
        build: .
        ports:
            - '9009:80'
            - '456:456'
        volumes:
            - ./nginx.conf:/etc/nginx/conf.d/default.conf
            - /etc/letsencrypt:/etc/letsencrypt:ro
        networks:
            - web_clients
        restart: unless-stopped
